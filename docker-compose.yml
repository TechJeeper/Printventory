version: '3.8'

services:
  printventory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printventory-server
    ports:
      - "5000:5000"
      # For HTTPS inside the container, map 443 (or keep 5000) and set TLS env vars below.
      # - "443:5000"
    volumes:
      # Persist database and application data to local directory
      # Server mode stores the SQLite DB at /root/.config/Printventory/data/printventory.db
      # (host path: ./data/data/printventory.db). Optional: PRINTVENTORY_DB_PATH to override.
      - ./data:/root/.config/Printventory
      # Mount network shares for accessing files
      # For Windows Docker Desktop:
      # 1. Map network share to drive: net use Z: \\msi\folder1 /persistent:yes
      # 2. Uncomment the line below to mount it into the container
      # - Z:/:/mnt/msi-folder1:ro
      # Then use Linux paths in Printventory: /mnt/msi-folder1/path/to/file
      # 
      # Option 1: Mount mapped Windows network drive (Windows Docker Desktop)
      # - Z:/:/mnt/msi-folder1:ro
      # Option 2: Mount SMB/CIFS share directly (Linux host)
      # First, install cifs-utils on the host: sudo apt-get install cifs-utils
      # Then mount on host: sudo mount -t cifs //server/share /mnt/network-share -o username=user,password=pass
      # Then uncomment: - /mnt/network-share:/mnt/network-share:ro
      # Option 3: Mount local directory (if files are on the Docker host)
      # - /path/to/local/files:/mnt/models:ro
      # Optional: TLS certificate directory for PRINTVENTORY_TLS_* (see environment section)
      # - ./certs:/certs:ro
    environment:
      - DISPLAY=:99
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      # Disable dconf / dbus fatal warnings in headless Docker (session bus started in entrypoint)
      - DCONF_DISABLE=1
      - GIO_USE_VFS=local
      - GIO_USE_VOLUME_MONITOR=unix
      - DBUS_FATAL_WARNINGS=0
      # Preview parsing memory controls (override defaults when needed).
      # Keep worker memory well below the container/host RAM budget — OOM kills the whole
      # Electron process and drops all WebSocket clients (browser shows "WebSocket connection failed").
      # Recommend Docker Desktop / host RAM of 4GB+ for this container when scanning large libraries.
      - PRINTVENTORY_PREVIEW_3MF_WORKER_MEMORY_MB=512
      - PRINTVENTORY_PREVIEW_3MF_MAX_FILE_SIZE_MB=200
      # Optional: Set STL Home directory via environment variable (applied when unset in DB, or set
      # PRINTVENTORY_ENV_OVERRIDES_SETTINGS=1 to always apply env on every start — legacy behavior).
      # Use Linux-style absolute paths (e.g., /mnt/network-share/models)
      # - STL_HOME=/mnt/network-share/models
      #
      # --- HTTPS (optional): TLS terminates in Printventory (no reverse proxy required) ---
      # Mount PEM files and point env vars at them. Browser uses https:// and wss:// automatically.
      # - PRINTVENTORY_TLS_CERT=/certs/fullchain.pem
      # - PRINTVENTORY_TLS_KEY=/certs/privkey.pem
      # Optional intermediate CA bundle:
      # - PRINTVENTORY_TLS_CA=/certs/chain.pem
      # (SSL_CERT_FILE / SSL_KEY_FILE are also accepted.)
      #
      # If you terminate TLS with Traefik/Caddy/nginx instead, leave these unset (container stays HTTP)
      # and configure WebSocket upgrade (wss) on the proxy — otherwise the UI will misbehave over https://.
    restart: unless-stopped
    # Give the container enough RAM. Under ~2G, hash/scan/preview work often OOMs Electron
    # (see "OOM error in V8: Zone Allocation failed"), which looks like WebSocket failures in the browser.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #     reservations:
    #       memory: 1G
    mem_limit: 4g
    mem_reservation: 1g

# Using bind mount instead of named volume for better control and persistence
# Database is now stored in ./data directory on the host filesystem
# volumes:
#   printventory-data:
#     driver: local

