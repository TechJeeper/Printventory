<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PandaCam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="assets/panda-logo.png" alt="PandaCam Logo" id="logo" onerror="this.src='assets/default-logo.png'; this.onerror='';">
      <h1>PandaCam</h1>
    </div>
    
    <div class="file-section">
      <div class="file-selection">
        <input type="text" id="sdp-path" placeholder="Path to ffmpeg.sdp file" readonly>
        <button id="browse-btn">Browse</button>
      </div>
      <p class="file-hint">Select the ffmpeg.sdp file from BambuStudio's cameratools folder</p>
    </div>
    
    <div class="status-section">
      <div class="status-indicator">
        <div id="status-circle" class="status-circle"></div>
        <span id="status-text">Not Running</span>
      </div>
    </div>
    
    <div class="action-buttons">
      <button id="start-btn" class="action-btn start-btn" disabled>Start Webcam</button>
      <button id="stop-btn" class="action-btn stop-btn" disabled>Stop Webcam</button>
    </div>
    
    <div id="message-box" class="message-box hidden"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
